        <path d="M-30 -20 l20 -12 l20 12 l0 24 l-20 12 l-20 -12 z" opacity="0.5"/>
        <path d="M10 -20 l20 -12 l20 12 l0 24 l-20 12 l-20 -12 z" opacity="0.8"/>
        <path d="M-10 18 l20 -12 l20 12 l0 24 l-20 12 l-20 -12 z"/>
