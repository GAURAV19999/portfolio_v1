    <pattern id="grid4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2740" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg4)"/>
  <rect width="1200" height="630" fill="url(#grid4)"/>
  <rect width="1200" height="630" fill="url(#g14)"/>
  <rect width="1200" height="630" fill="url(#g24)"/>
  <rect x="2" y="2" width="1196" height="626" rx="22" fill="none" stroke="#223049" stroke-width="2"/>
  <!-- kicker -->
