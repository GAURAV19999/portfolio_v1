  <text x="108" y="162" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#8B5CF6">FABRIC vs POWER BI</text>
  <!-- title -->
  <text x="80" y="250" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" fill="#F3F7FF">Which to Pick?</text>
  <!-- brand -->
  <text x="80" y="560" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#AFC3E6">Gaurav Kumar Vishvakarma</text>
  <text x="80" y="590" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#5f7399">Freelance Power BI Consultant &amp; Data Analyst</text>
  <!-- motif -->
  <g transform="translate(760,300)">
    <g>
      <rect x="-180" y="-120" width="150" height="240" rx="18" fill="#0e1830" stroke="#8B5CF6" stroke-width="2.5"/>
