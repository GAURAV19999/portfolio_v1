<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Which to Pick?">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1222"/><stop offset="1" stop-color="#070B16"/>
    </linearGradient>
    <radialGradient id="g14" cx="0.82" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.28"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g24" cx="0.1" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#0A80FF" stop-opacity="0.22"/><stop offset="1" stop-color="#0A80FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="acc4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#0A80FF"/>
